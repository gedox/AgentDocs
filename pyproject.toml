[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdocs"
version = "0.1.0"
description = "Turn an online documentation site into local Markdown for AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "markdownify>=0.11",
]

[project.scripts]
agentdocs = "agentdocs.cli:main"

[tool.setuptools.packages.find]
include = ["agentdocs*"]
